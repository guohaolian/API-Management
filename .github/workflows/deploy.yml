# 推送到 main 后 SSH 到阿里云 ECS，执行 deploy/scripts/deploy.sh（与 DEPLOY-ALIYUN.md 日常更新一致）。
# 配置说明见 docs/DEPLOY-ALIYUN.md 第 14 节、docs/GITHUB-ACTIONS-DEPLOY.md

name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              echo "ERROR: GitHub Secret DEPLOY_PATH 未配置（服务器上仓库的绝对路径）"
              exit 1
            fi
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "ERROR: $DEPLOY_PATH 不是 git 仓库，请先在服务器 clone 本仓库"
              exit 1
            fi
            cd "$DEPLOY_PATH"
            # 在 pull 新 deploy.sh 之前先对齐远程（解决服务器上 __pycache__ 本地改动阻塞 pull）
            git fetch origin main
            git checkout main
            find BACKEND-NEXUS -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
            git checkout -- FRONTEND-NEXUS/package-lock.json 2>/dev/null || true
            if ! git pull --ff-only origin main; then
              echo "WARN: 预拉取失败，执行 git reset --hard origin/main"
              git reset --hard origin/main
            fi
            bash deploy/scripts/deploy.sh
